<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Melody Garden · GameHub</title>
    <meta name="theme-color" content="#f4efe4" />
    <link rel="stylesheet" href="/shared/v1/kit.css" />
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <main class="garden">
      <h1>Melody Garden</h1>
      <p class="lead">Pick a style, then shape the music with the sliders.</p>

      <section>
        <h2>Styles</h2>
        <div id="styles" class="styles" role="radiogroup" aria-label="Music styles"></div>
      </section>

      <section>
        <h2>Shape it</h2>
        <div id="dials"></div>
        <button type="button" class="text-button" id="reset">Back to how this style starts</button>
      </section>

      <section>
        <h2>Players</h2>
        <p class="hint">Tap to let a player rest, tap again to bring them back.</p>
        <div id="players" class="chips"></div>
      </section>

      <section>
        <h2>Nature sounds</h2>
        <div id="nature" class="chips"></div>
      </section>

      <section>
        <h2>Volume</h2>
        <label class="dial"><span class="ends"><span>Quiet</span><span>Loud</span></span><input type="range" id="volume" min="0" max="1" step="0.05" aria-label="Volume" /></label>
      </section>
    </main>

    <footer class="player">
      <button type="button" id="play" class="play" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" /></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
      </button>
      <div class="now"><small id="nowLabel">Ready</small><strong id="nowName"></strong></div>
    </footer>

    <script type="module" src="game.js"></script>
  </body>
</html>
