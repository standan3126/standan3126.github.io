<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Melody Garden · GameHub</title>
    <meta name="theme-color" content="#f4efe4" />
    <link rel="stylesheet" href="/shared/v1/kit.css" />
    <link rel="stylesheet" href="/shared/v1/settings.css" />
    <link rel="stylesheet" href="game.css" />
  </head>
  <body class="hub-scrolls">
    <main class="garden">
      <h1>Melody Garden</h1>
      <p class="lead">Pick a style, then shape the music with the sliders.</p>

      <section>
        <h2>Styles</h2>
        <div id="styles" class="styles" role="radiogroup" aria-label="Music styles"></div>
      </section>

      <section>
        <h2>Shape it</h2>
        <div id="dials"></div>
        <button type="button" class="text-button" id="reset">Back to how this style starts</button>
      </section>

      <section>
        <h2>Players</h2>
        <p class="hint">Tap to let a player rest, tap again to bring them back.</p>
        <div id="players" class="chips"></div>
      </section>

      <section>
        <h2>Nature sounds</h2>
        <div id="nature" class="chips"></div>
      </section>

      <section>
        <h2>My songs</h2>
        <p class="hint">Shape a style the way you like it, then save it as your own song.</p>
        <form id="saveForm" class="save-row">
          <input id="songName" type="text" maxlength="30" placeholder="Name your song" aria-label="Song name" />
          <button type="submit" class="small-button">Save song</button>
        </form>
        <div id="songs" class="songs"></div>
        <button type="button" class="text-button" id="pasteOpen">Paste a song code</button>
        <div id="codeArea" hidden>
          <textarea id="codeBox" class="code-box" rows="3" aria-label="Song code"></textarea>
          <button type="button" class="small-button" id="pasteAdd">Add this song</button>
        </div>
        <p id="songNote" class="hint" role="status"></p>
      </section>
    </main>

    <footer class="player">
      <button type="button" id="play" class="play" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" /></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
      </button>
      <div class="now"><small id="nowLabel">Ready</small><strong id="nowName"></strong></div>
    </footer>

    <script type="module" src="game.js"></script>
  </body>
</html>
